# ============================================================
# STACK COMPLETO DE MONITOREO - Comfrut
# Zabbix 7.0 + Grafana 11 + Wazuh 4.9
# ============================================================
# Uso: docker compose --env-file env.conf up -d
# ============================================================

networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/postgres
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/grafana
  wazuh-indexer-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/wazuh-indexer
  wazuh-manager-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/wazuh-manager-logs
  wazuh-manager-etc:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/wazuh-manager-etc

services:

  # ============================================================
  # POSTGRESQL - Base de datos para Zabbix
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: zabbix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      monitoring:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ============================================================
  # ZABBIX SERVER
  # ============================================================
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:${ZABBIX_VERSION}
    container_name: zabbix-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZBX_STARTSNMPTRAPPER: ${ZBX_STARTSNMPTRAPPER}
      ZBX_CACHESIZE: 128M
      ZBX_HISTORYCACHESIZE: 64M
      ZBX_TRENDCACHESIZE: 32M
      ZBX_VALUECACHESIZE: 64M
      ZBX_TIMEOUT: 30
      ZBX_STARTPOLLERS: 10
      ZBX_STARTPOLLERSUNREACHABLE: 5
      ZBX_STARTTRAPPERS: 5
      ZBX_STARTPINGERS: 5
      ZBX_STARTDISCOVERERS: 3
    ports:
      - "10051:10051"
    volumes:
      - ./config/zabbix-server/zabbix_server.conf:/etc/zabbix/zabbix_server_custom.conf:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      monitoring:
        ipv4_address: 172.28.0.11
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================================
  # ZABBIX SNMP TRAPS (receptor de traps SNMP)
  # ============================================================
  zabbix-snmptraps:
    image: zabbix/zabbix-snmptraps:${ZABBIX_VERSION}
    container_name: zabbix-snmptraps
    restart: unless-stopped
    ports:
      - "162:1162/udp"
    volumes:
      - ./data/snmptraps:/var/lib/zabbix/snmptraps
    networks:
      monitoring:
        ipv4_address: 172.28.0.12

  # ============================================================
  # ZABBIX WEB FRONTEND (Nginx + PHP)
  # ============================================================
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:${ZABBIX_VERSION}
    container_name: zabbix-web
    restart: unless-stopped
    depends_on:
      - zabbix-server
      - postgres
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_SERVER_NAME: ${ZBX_SERVER_NAME}
      PHP_TZ: ${PHP_TZ}
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      monitoring:
        ipv4_address: 172.28.0.13

  # ============================================================
  # ZABBIX AGENT 2 (monitoreo del propio servidor)
  # ============================================================
  zabbix-agent:
    image: zabbix/zabbix-agent2:${ZABBIX_VERSION}
    container_name: zabbix-agent
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_HOSTNAME: "docker-monitoring-server"
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_ACTIVE_ALLOW: "true"
    privileged: true
    pid: host
    volumes:
      - /:/host/root:ro
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      monitoring:
        ipv4_address: 172.28.0.14

  # ============================================================
  # GRAFANA con plugin de Zabbix
  # ============================================================
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: ${GF_INSTALL_PLUGINS}
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ${GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS}
      GF_SERVER_ROOT_URL: "http://${SERVER_IP}:3000/"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: ${TZ}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      monitoring:
        ipv4_address: 172.28.0.20
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================
  # WAZUH INDEXER (OpenSearch)
  # ============================================================
  wazuh-indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION}
    container_name: wazuh-indexer
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "true"
      discovery.type: single-node
      plugins.security.ssl.http.enabled: "false"
      compatibility.override_main_response_version: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh/wazuh-indexer/opensearch.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
    networks:
      monitoring:
        ipv4_address: 172.28.0.30
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================================
  # WAZUH MANAGER
  # ============================================================
  wazuh-manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    container_name: wazuh-manager
    restart: unless-stopped
    depends_on:
      - wazuh-indexer
    environment:
      INDEXER_URL: "http://wazuh-indexer:9200"
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      FILEBEAT_SSL_VERIFICATION_MODE: none
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD}
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    volumes:
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-logs:/var/ossec/logs
      - ./config/wazuh/wazuh-manager/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
    networks:
      monitoring:
        ipv4_address: 172.28.0.31
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================================
  # WAZUH DASHBOARD
  # ============================================================
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION}
    container_name: wazuh-dashboard
    restart: unless-stopped
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
      WAZUH_API_URL: "https://wazuh-manager"
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD}
      SERVER_SSL_ENABLED: "false"
      INDEXER_URL: "http://wazuh-indexer:9200"
    ports:
      - "5601:5601"
    volumes:
      - ./config/wazuh/wazuh-dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    networks:
      monitoring:
        ipv4_address: 172.28.0.32
    deploy:
      resources:
        limits:
          memory: 1G
